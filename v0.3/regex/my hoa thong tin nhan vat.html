    <style>
        :root {
            /* --- 字型定義 (Fonts Definition) --- */
            /* 用於史詩感標題 (角色名) 和清晰的數據 (Lv, HP, 數值) */
            --font-primary: 'Cinzel', Georgia, serif;

            /* 用於UI介面、標題和需要高可讀性的地方 */
            --font-secondary: 'Noto Sans SC', 'Noto Sans TC', 'Microsoft YaHei', 'Microsoft JhengHei', 'PingFang SC', 'PingFang TC', Roboto, 'Helvetica Neue', Helvetica, Arial, serif, sans-serif;

            --font-body-serif: 'Noto Serif SC', 'Noto Serif TC', 'SimSun', 'PMingLiU', 'MingLiU', 'Songti SC', 'Songti TC', Georgia, 'Times New Roman', serif, sans-serif;

            /* --- 顏色定義 (Color Definitions) --- */
            --primary-theme-color: #808080;
            --primary-theme-color-rgb: 128, 128, 128;
            --secondary-theme-color: #808080;
            --secondary-theme-color-rgb: 128, 128, 128;

        body {

        .char-level,

        /* 長篇內文使用思源宋體 */

        .card-wrapper {

        .card-wrapper[data-tier=\"1\"] {

        }

        .card-wrapper[data-tier=\"2\"] {

        }

        .card-wrapper[data-tier=\"3\"] {
            --secondary-theme-color: var(--tier-3-color);
            --secondary-theme-color-rgb: var(--tier-3-color-rgb);
        }

        .card-wrapper[data-tier=\"4\"] {
            --secondary-theme-color: var(--tier-4-color);

        }

        .card-wrapper[data-tier=\"5\"] {

        /* --- ANIMATION STYLES START --- */

        /* ========================================================================== */
        /* ===              全局動態背景網格 (Global Animated Grid)               === */
        /* ========================================================================== */
        /* 此效果將會應用在 .character-sheet 的偽元素上，
   位於基礎漸層色之上，種族特定動畫之下 (z-index: 0)。 */

        /* --- 核心修改：重新定義偽元素以承載網格 --- */
        .character-sheet::before,
        .character-sheet::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            /* 確保在 z-index: 1 的種族動畫之下 */
            pointer-events: none;
            opacity: 0.7;
            /* 移除舊的、不必要的屬性 */
        }

        /* --- 第一層: 等角投影主網格 (Isometric Grid) --- */
        .character-sheet::before {
            /* Sử dụng hai bộ gradient tuyến tính nghiêng để tạo các đường lưới đều */
            background-image:
                repeating-linear-gradient(60deg,
                    /* 第一組線條角度 */
                    rgba(var(--secondary-theme-color-rgb), 0.15) 0,
                    rgba(var(--secondary-theme-color-rgb), 0.15) 1px,
                    transparent 1px,
                    transparent 40px
                    /* 網格間距 */
                ),
                repeating-linear-gradient(120deg,
                    /* 第二組線條角度 */
                    rgba(var(--secondary-theme-color-rgb), 0.15) 0,
                    rgba(var(--secondary-theme-color-rgb), 0.15) 1px,
                    transparent 1px,
                    transparent 40px);
            /* 應用一個緩慢的、對角線平移的動畫 */
            animation: grid-pan-slow 35s linear infinite;
            opacity: 0.5;
            /* 讓主網格更柔和 */
        }

        /* --- 第二層: 視差粒子點陣 (Parallax Dot Matrix) --- */
        .character-sheet::after {
            /* 使用徑向漸變創建點陣圖案 */
            background-image:
                radial-gradient(rgba(var(--secondary-theme-color-rgb), 0.2) 1px,
                    /* 點的大小和顏色 */
                    transparent 1px);
            background-size: 25px 25px;
            /* 點陣間距 */
            /* 應用一個速度更快的平移動畫，以創造深度感 */
            animation: grid-pan-fast 20s linear infinite;
            opacity: 0.6;
            /* 讓粒子點更明顯一些 */
        }

        /* --- 動畫定義 --- */

        /* 緩慢的主網格平移動畫 */
        @keyframes grid-pan-slow {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: -400px -400px;
            }
        }

        /* 較快的粒子點陣平移動畫 */
        @keyframes grid-pan-fast {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 0px 500px;
            }
        }

        /* ========================================================================== */

        /* ========================================================================== */

        /* --- 基礎容器規則 --- */
        .dynamic-bg-container {

 background-size: contain;

        .card-wrapper.bg-anim-primordial-essence .dynamic-bg-container {

            .card-wrapper.bg-anim-machina-core .dynamic-bg-container {

                background: linear-gradient(90deg, transparent, rgba(var(--primary-theme-color-rgb), 0.2), transparent);

                border-top: 1px solid var(--primary-theme-color);
                border-bottom: 1px solid var(--primary-theme-color);
                margin-bottom: 10px;
                font-family: var(--font-primary);

                font-weight: bold;
                color: var(--text-color);

            .tab-button {
                flex: 1 1 auto;
                text-align: center;
                font-family: var(--font-secondary);
                font-size: 1rem;
                background: rgba(51, 51, 51, 0.4);
                border: none;
                padding: 0.625rem 0.5rem;
                cursor: pointer;
                border-bottom: 3px solid transparent;
                transition: all 0.2s ease;
                margin-bottom: -2px;
                position: relative;
                color: var(--text-muted-color);
            }

            .tab-button:hover {
                background-color: rgba(51, 51, 51, 0.5);
                color: var(--text-color);
            }

            .tab-button.active {
                border-bottom-color: var(--secondary-theme-color);
                font-weight: bold;
                color: var(--secondary-theme-color);
                background-color: rgba(51, 51, 51, 0.6);
            }

            .tab-button:active {
                background-color: rgba(51, 51, 51, 0.7);
            }

            .tab-content-container {
                padding: 1rem 5px;
            }

            .tab-content {
                display: none;
            }

            .tab-content.active {
                display: block;
                animation: slideInUp 0.5s ease-out;
            }

            @keyframes slideInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes glow-pulse {

                0%,
                100% {
                    transform: translate(-50%, -50%) scale(0.95);
                }

                50% {
                    transform: translate(-50%, -50%) scale(1.05);
                }
            }

            @keyframes release-shockwave-outer {
                from {
                    transform: translate(-50%, -50%) scale(0.5);
                    opacity: 0.7;
                }

                to {
                    transform: translate(-50%, -50%) scale(2.5);
                    opacity: 0;
                }
            }

            @keyframes release-shockwave-inner {
                from {
                    transform: translate(-50%, -50%) scale(0);
                    opacity: 0.8;
                }

                to {
                    transform: translate(-50%, -50%) scale(1.5);
                    opacity: 0;
                }
            }

            .char-name::before,
            .char-name::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 100%;
                padding-top: 100%;
                border-radius: 50%;
                border-style: solid;
                border-color: var(--secondary-theme-color);
                opacity: 0;
                pointer-events: none;
                transform: translate(-50%, -50%) scale(0);
            }

            .char-name.is-releasing::before {
                border-width: 4px;
                animation: release-shockwave-inner 0.5s ease-out;
            }

            .char-name.is-releasing::after {
                border-width: 2px;
                animation: release-shockwave-outer 0.7s ease-out;
            }

            @keyframes release-glow {
                from {
                    box-shadow: 0 0 0 0px rgba(var(--primary-theme-color-rgb), 0.5);
                }

                to {
                    box-shadow: 0 0 0 15px rgba(var(--primary-theme-color-rgb), 0);
                }
            }

            .attribute-item.is-releasing-glow .attribute-box,
            .tab-button.is-releasing-glow {
                animation: release-glow 0.5s ease-out;
            }

            @keyframes scan-pulse {
                from {
                    background-position: -200% 0;
                }

                to {
                    background-position: 200% 0;
                }
            }

            .vital-item::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 2;
                background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.4) 50%, transparent 100%);
                background-size: 200% 100%;
                background-position: -200% 0;
                pointer-events: none;
            }

            .vital-item.is-active::before {
                animation: scan-pulse 0.7s ease-out;
            }

            .vital-item.is-active .vital-label,
            .vital-item.is-active .vital-value {
                color: #fff;
            }

            #save-to-lorebook-btn {
                position: absolute;
                top: 15px;
                right: 15px;
                padding: 8px 12px;
                background-color: #4A5568;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-family: var(--font-secondary);
                font-size: 0.875rem;
                opacity: 0.8;
                transition: all 0.2s ease;
                z-index: 50;
            }

            #save-to-lorebook-btn:hover {
                opacity: 1;
            }

            /* --- MEDIA QUERIES & RESPONSIVE DESIGN START --- */
            @media (min-width: 768px) {
                .sheet-body {
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 15px;
                }

                .vitals-section,
                .tab-container {
                    grid-column: 1 / -1;
                }

                .core-info {
                    grid-column: 1 / 2;
                    display: flex;
                }

                .attributes-section {
                    grid-column: 2 / 3;
                    display: flex;
                }

                .info-grid {
                    grid-auto-rows: 1fr;
                }

                .attributes-grid {
                    grid-template-columns: repeat(2, 1fr);
                    flex-grow: 1;
                }

                .attributes-grid::before,
                .attributes-grid::after {
                    display: block;
                    left: 50%;
                }

                .attributes-grid::before {
                    top: 33.333%;
                }

                .attributes-grid::after {
                    top: 66.666%;
                }
            }

            @media (max-width: 767px) {
                body {
                    padding: 20px 10px;
                }

                .card-wrapper::before,
                .card-wrapper::after {
                    display: none;
                }

                .core-info,
                .attributes-section {
                    display: flex;
                    justify-content: center;
                }

                .attributes-section,
                .vitals-section {
                    margin-top: 15px;
                }

                .info-grid,
                .attributes-grid {
                    max-width: 500px;
                }

                .info-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .attributes-grid {
                    grid-template-columns: repeat(3, 1fr);
                }

                .attributes-grid::before,
                .attributes-grid::after {
                    display: block;
                    top: 50%;
                }

                .attributes-grid::before {
                    left: calc(33.333% - 1.33px);
                }

                .attributes-grid::after {
                    left: calc(66.666% + 1.33px);
                }
            }

            @media (min-width: 481px) {

                .attributes-grid::before,
                .attributes-grid::after {
                    width: 28px;
                    height: 28px;
                    border-width: 4px;
                }
            }

            @media (max-width: 480px) {
                html {
                    font-size: 14px;
                }

                .character-sheet {
                    box-shadow: none;
                    border-width: 2px;
                }

                .sheet-header {
                    border-bottom-width: 0;
                    padding-top: 15px;
                }

                .sheet-body {
                    display: block;
                    padding: 15px;
                }

                .core-info,
                .attributes-section {
                    display: block;
                }

                .info-grid {
                    grid-template-columns: 1fr;
                    max-width: 100%;
                }

                .info-grid::before {
                    display: none;
                }

                .info-grid .info-item {
                    border-radius: 5px !important;
                }

                .attributes-grid {
                    max-width: 100%;
                    grid-template-columns: repeat(2, 1fr);
                }

                .attributes-grid::before,
                .attributes-grid::after {
                    display: block;
                    left: 50%;
                    top: auto;
                }

                .attributes-grid::before {
                    top: 33.333%;
                }

                .attributes-grid::after {
                    top: 66.666%;
                }

                .core-info-placeholder {
                    display: none;
                }

                .tab-nav {
                    flex-wrap: wrap;
                }

                .tab-button {
                    flex-basis: 50%;

                #save-to-lorebook-btn {
                    padding: 5px 8px;
                    font-size: 1.2rem;
                    top: 10px;
                    right: 10px;
                    width: auto;
                    height: auto;
                    background-color: rgba(74, 85, 104, 0.6);
                }

                .btn-text {
                    display: none;
                }
            }

            @media (max-width: 360px) {

                /* 1. Phông chữ cơ bản được giảm xuống còn 10pt */
                html {
                    font-size: 10pt;
                }

                /* 2. Giảm kích thước và khoảng cách của mỗi thùng chứa để phù hợp với màn hình cực hẹp */
                body {
                    padding: 10px 5px;
                }

                .sheet-header {
                    padding: 10px 10px 5px;
                }

                .sheet-body {
                    padding: 10px 5px;
                }

                .card {
                    padding: 0.75rem;
                    /* ~10px */
                    margin-bottom: 0.5rem;
                    /* ~7px */
                }

                .tab-content-container {
                    padding: 0.75rem 0;
                }

                /* 3. Giảm đáng kể khoảng cách giữa tiêu đề và phông chữ văn bản */
                .char-name {
                    font-size: 2rem;
                    /* 從 2.5rem 縮小 */
                    letter-spacing: 1px;
                    /* Bóng văn bản được đơn giản hóa để cải thiện độ rõ nét ở kích thước nhỏ */
                    text-shadow: 1px 1px 0 var(--primary-theme-color),
                    -1px -1px 0 var(--primary-theme-color),
                    1px -1px 0 var(--primary-theme-color),
                    -1px 1px 0 var(--primary-theme-color),
                    0 0 3px var(--primary-theme-color);
                }

                .char-sub-info {
                    gap: 0.75rem;
                    /* 從 1.5rem 縮小 */
                    margin-top: 0.5rem;
                }

                .subsection-title {
                    font-size: 1.3rem;
                    margin-top: 0.75rem;
                    margin-bottom: 0.25rem;
                    padding-left: 0.5rem;
                }

                .card-title {
                    font-size: 1.2rem;
                }

                .attribute-total {
                    font-size: 1.3rem;
                }

                .info-value,
                .vital-value {
                    font-size: 1.1rem;
                }

                /* Đảm bảo nhãn và văn bản phụ không quá nhỏ */
                .info-label,
                .card-subtitle,
                .card-tag {
                    font-size: 0.9rem;
                }

                .tab-button {
                    font-size: 0.9rem;
                    padding: 0.5rem 0.25rem;
                }

                /* 4. Các thiết kế khác có thể giúp đọc bình thường (điều chỉnh bố cục) */
                .vitals-grid {
                    grid-template-columns: 1fr;
                    /* 將 HP/MP/SP 垂直堆疊 */
                    gap: 5px;
                }

                .attributes-grid {
                    grid-template-columns: 1fr;
                    /* 將屬性垂直堆疊 */
                }

                .attributes-grid::before,
                .attributes-grid::after {
                    display: none;
                    /* 在單欄佈局中隱藏不適用的裝飾線 */
                }

                /* 5. 優化右上角按鈕 */
                #save-to-lorebook-btn {
                    top: 8px;
                    right: 8px;
                    padding: 4px 6px;
                    font-size: 1rem;
                    /* 從 1.2rem 縮小 */
                }
            }

</head>
